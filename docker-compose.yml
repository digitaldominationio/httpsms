services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: httpsms
      POSTGRES_USER: dbusername
      POSTGRES_PASSWORD: dbpassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 5s
    networks:
      - default

  redis:
    image: redis:7-alpine
    command: redis-server
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - default

  api:
    build:
      context: ./api
    environment:
      ENV: production
      GCP_PROJECT_ID: httpsms-docker
      USE_HTTP_LOGGER: "true"
      ENTITLEMENT_ENABLED: "false"
      EVENTS_QUEUE_TYPE: emulator
      EVENTS_QUEUE_NAME: events
      EVENTS_QUEUE_ENDPOINT: http://api:8000/v1/events
      EVENTS_QUEUE_USER_API_KEY: system-user-api-key
      EVENTS_QUEUE_USER_ID: system-user-id
      SMTP_FROM_NAME: httpSMS
      SMTP_FROM_EMAIL: httpsms@andro.ddmn.us
      SMTP_HOST: smtp.mailtrap.io
      SMTP_PORT: "2525"
      APP_URL: https://andro.ddmn.us
      APP_NAME: httpSMS
      APP_PORT: "8000"
      SWAGGER_HOST: andro-api.ddmn.us
      DATABASE_URL: postgresql://dbusername:dbpassword@postgres:5432/httpsms
      DATABASE_URL_DEDICATED: postgresql://dbusername:dbpassword@postgres:5432/httpsms
      REDIS_URL: redis://@redis:6379
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - default
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.middlewares.httpsms-api-redirect.redirectscheme.scheme=https
      - traefik.http.routers.httpsms-api-http.entryPoints=http
      - traefik.http.routers.httpsms-api-http.rule=Host(`andro-api.ddmn.us`)
      - traefik.http.routers.httpsms-api-http.middlewares=httpsms-api-redirect
      - traefik.http.routers.httpsms-api-https.entryPoints=https
      - traefik.http.routers.httpsms-api-https.rule=Host(`andro-api.ddmn.us`)
      - traefik.http.routers.httpsms-api-https.tls=true
      - traefik.http.routers.httpsms-api-https.tls.certresolver=letsencrypt
      - traefik.http.routers.httpsms-api-https.service=httpsms-api-svc
      - traefik.http.services.httpsms-api-svc.loadbalancer.server.port=8000

  web:
    build:
      context: ./web
      args:
        API_BASE_URL: https://andro-api.ddmn.us
        APP_URL: https://andro.ddmn.us
        APP_NAME: httpSMS
        APP_ENV: production
        FIREBASE_API_KEY: ""
        FIREBASE_AUTH_DOMAIN: ""
        FIREBASE_PROJECT_ID: ""
        FIREBASE_STORAGE_BUCKET: ""
        FIREBASE_MESSAGING_SENDER_ID: ""
        FIREBASE_APP_ID: ""
        FIREBASE_MEASUREMENT_ID: ""
        CLOUDFLARE_TURNSTILE_SITE_KEY: ""
    expose:
      - "3000"
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - default
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.middlewares.httpsms-web-redirect.redirectscheme.scheme=https
      - traefik.http.routers.httpsms-web-http.entryPoints=http
      - traefik.http.routers.httpsms-web-http.rule=Host(`andro.ddmn.us`)
      - traefik.http.routers.httpsms-web-http.middlewares=httpsms-web-redirect
      - traefik.http.routers.httpsms-web-https.entryPoints=https
      - traefik.http.routers.httpsms-web-https.rule=Host(`andro.ddmn.us`)
      - traefik.http.routers.httpsms-web-https.tls=true
      - traefik.http.routers.httpsms-web-https.tls.certresolver=letsencrypt
      - traefik.http.routers.httpsms-web-https.service=httpsms-web-svc
      - traefik.http.services.httpsms-web-svc.loadbalancer.server.port=3000

volumes:
  postgres_data:
  redis_data:

networks:
  coolify:
    external: true
